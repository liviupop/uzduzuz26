<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Seed-8: the Silicon Seed reference computer, 609 NAND gates simulated gate by gate.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Seed-8 · Silicon Seed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a lesson on reading lamps, then the instrument (inside parts over switches over controls), then the 256 boxes beside the program in plain words. */
:root {
  --bg: #e7ece6;
  --panel: #d6ded5;
  --panel-edge: #b7c3b6;
  --ink: #1d2a24;
  --ink-soft: #4d5e55;
  --lamp-off: #b9bfae;
  --lamp-on: #f0a12a;
  --lamp-glow: rgba(240, 161, 42, .55);
  --switch: #2d4a3e;
  --switch-up: #f4f1e8;
  --good: #2f7d4f;
  --bad: #b23a2e;
  --cell: #eef2ed;
  --cell-job: #cfe0d3;
  --cell-box: #e3eadf;
  --cell-num: #f1e6cf;
  --cell-hot: #f6c66f;
  --bar: #2d4a3e;
  --display: "Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
  --body: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b18; --panel: #1f2a25; --panel-edge: #33433b; --ink: #e3ebe5; --ink-soft: #9fb0a6;
  --lamp-off: #3a4740; --lamp-on: #ffb23e; --lamp-glow: rgba(255, 178, 62, .5);
  --switch: #9cc3ae; --switch-up: #1a231f; --good: #6ccf93; --bad: #ff7d6e;
  --cell: #18211d; --cell-job: #23382d; --cell-box: #1d2b24; --cell-num: #3a3020; --cell-hot: #7a5615; --bar: #9cc3ae;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141b18; --panel: #1f2a25; --panel-edge: #33433b; --ink: #e3ebe5; --ink-soft: #9fb0a6;
  --lamp-off: #3a4740; --lamp-on: #ffb23e; --lamp-glow: rgba(255, 178, 62, .5);
  --switch: #9cc3ae; --switch-up: #1a231f; --good: #6ccf93; --bad: #ff7d6e;
  --cell: #18211d; --cell-job: #23382d; --cell-box: #1d2b24; --cell-num: #3a3020; --cell-hot: #7a5615; --bar: #9cc3ae;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 30px; }
header { display: grid; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 44px); letter-spacing: -.02em; margin: 0; line-height: 1.05; }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
.lede { max-width: 66ch; color: var(--ink-soft); }
.lede b, .note b { color: var(--ink); font-weight: 600; }
.label { font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.note { max-width: 66ch; color: var(--ink-soft); font-size: 15px; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
section > *, .part, .lower > *, .lesson > *, .brow > * { min-width: 0; }
[hidden] { display: none !important; }

.lang { display: flex; gap: 4px; }
.lang button { font-family: var(--display); font-size: 12px; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--panel-edge); background: transparent; color: var(--ink); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--switch); color: var(--switch-up); border-color: var(--switch); }

.panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; max-width: 560px; }
.bitcol { display: grid; justify-items: center; gap: 5px; }
.bitcol small { font-family: var(--display); font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.lamp { width: clamp(26px, 6vw, 40px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--lamp-off); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); transition: background .06s, box-shadow .06s; border: 0; padding: 0; }
button.lamp { cursor: pointer; }
.lamp.on { background: var(--lamp-on); box-shadow: 0 0 18px 4px var(--lamp-glow), inset 0 -3px 0 rgba(0,0,0,.1); }
.lamp.sm { width: 16px; }
.lamp.sm.on { box-shadow: 0 0 8px 1px var(--lamp-glow); }
.readout { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; }
.readout strong { font-size: 22px; font-weight: 600; }
.sum { font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums; min-height: 1.6em; }
.sum strong { font-size: 24px; }

.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 760px) { .lesson { grid-template-columns: minmax(0, 1fr); } }
.levels { display: grid; gap: 12px; }
.level { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 10px; }
.level .n { font-family: var(--display); font-size: 13px; color: var(--ink-soft); padding-top: 2px; }
.level b { font-weight: 600; }
.game { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ok { color: var(--good); font-weight: 600; }
.no { color: var(--bad); font-weight: 600; }

.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px 18px; }
.part { display: grid; gap: 5px; align-content: start; }
.part .lamps { display: flex; gap: 4px; flex-wrap: wrap; }
.part .val { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; }
.part .val b { font-size: 17px; font-weight: 600; }
.part p { font-size: 13.5px; line-height: 1.4; color: var(--ink-soft); }
.flags { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.flag { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-soft); }
.flag b { font-family: var(--display); font-size: 12px; color: var(--ink); font-weight: 600; letter-spacing: .04em; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.steps span { font-family: var(--display); font-size: 12px; padding: 5px 9px; border-radius: 3px; border: 1px solid var(--panel-edge); color: var(--ink-soft); }
.steps span.on { background: var(--lamp-on); border-color: var(--lamp-on); color: #1d2a24; }
.jobs { display: flex; flex-wrap: wrap; gap: 4px; }
.jobs span { font-family: var(--display); font-size: 11px; padding: 3px 6px; border-radius: 3px; color: var(--ink-soft); border: 1px solid transparent; }
.jobs span.on { border-color: var(--lamp-on); color: var(--ink); background: var(--bg); font-weight: 600; }

.switch { appearance: none; border: 0; cursor: pointer; width: clamp(26px, 6vw, 40px); height: 54px; border-radius: 6px; background: var(--switch); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; left: 18%; right: 18%; height: 40%; border-radius: 4px; background: var(--switch-up); top: 52%; transition: top .08s; }
.switch[aria-pressed="true"]::after { top: 8%; }
:focus-visible { outline: 3px solid var(--lamp-on); outline-offset: 2px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.field { display: grid; gap: 4px; }
select, input[type=number], input[type=text] { font-family: var(--display); font-size: 14px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--panel-edge); background: var(--bg); color: var(--ink); }
input[type=number] { width: 7.5em; }
select { max-width: calc(100vw - 72px); }
.controls .field { min-width: 0; max-width: 100%; }
input[type=range] { accent-color: var(--switch); width: 130px; }
.speed-read { font-family: var(--display); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
button.act { font-family: var(--display); font-size: 13px; font-weight: 600; padding: 9px 13px; border-radius: 4px; border: 1px solid var(--switch); background: var(--switch); color: var(--switch-up); cursor: pointer; }
button.act.ghost { background: transparent; color: var(--ink); border-color: var(--panel-edge); }

.story { font-size: 15.5px; padding: 12px 14px; border-radius: 4px; border: 1px solid var(--panel-edge); background: var(--bg); min-height: 3.2em; }
.story .verdict { display: block; margin-top: 6px; font-family: var(--display); font-size: 13.5px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-family: var(--display); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.memwrap { overflow-x: auto; }
.mem { display: grid; grid-template-columns: 2.8em repeat(16, 2.15em); gap: 2px; font-family: var(--display); font-size: 10.5px; font-variant-numeric: tabular-nums; width: max-content; }
.mem div { text-align: center; padding: 3px 0; border-radius: 2px; }
.mem .h { color: var(--ink-soft); text-align: right; padding-right: 4px; }
.mem .hc { color: var(--ink-soft); }
.mem .c { background: var(--cell); cursor: pointer; }
.mem .c.job { background: var(--cell-job); }
.mem .c.box { background: var(--cell-box); }
.mem .c.num { background: var(--cell-num); }
.mem .c.special { outline: 1px dashed var(--ink-soft); outline-offset: -1px; }
.mem .c.here { background: var(--cell-hot); color: #1d2a24; }
.mem .c.ed { outline: 2px solid var(--lamp-on); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.listing { display: grid; gap: 1px; font-size: 13.5px; max-height: 520px; overflow-y: auto; border: 1px solid var(--panel-edge); border-radius: 4px; background: var(--bg); }
.listing div { display: grid; grid-template-columns: 4.4em 5.4em minmax(0, 1fr); gap: 8px; padding: 4px 8px; align-items: baseline; }
.listing div.here { background: var(--cell-hot); color: #1d2a24; }
.listing div.here .muted { color: #1d2a24; }
.listing .addr, .listing .op { font-family: var(--display); font-size: 12px; font-variant-numeric: tabular-nums; }
.listing .op { font-weight: 600; }
.listing .muted { color: var(--ink-soft); }
.listing .tag { font-family: var(--display); font-size: 11px; color: var(--ink-soft); }
.tape { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 6px; min-height: 2.2em; align-content: start; }
.tape span { background: var(--cell); padding: 3px 7px; border-radius: 3px; }
details summary { cursor: pointer; font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
pre.src { font-family: var(--display); font-size: 12px; line-height: 1.5; background: var(--cell); padding: 12px; border-radius: 4px; overflow-x: auto; margin: 10px 0 0; }

.budget { display: grid; gap: 6px; max-width: 720px; }
.brow { display: grid; grid-template-columns: minmax(0, 15em) 3.2em minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.brow .num { font-family: var(--display); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.brow .track { height: 10px; background: var(--cell); border-radius: 2px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--bar); }
@media (max-width: 520px) { .brow { grid-template-columns: minmax(0, 1fr) 3em; } .brow .track { grid-column: 1 / -1; } }

/* boxes lesson */
.boxlesson { display: grid; gap: 18px; }
.mini { display: grid; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); gap: 8px; }
.card { background: var(--bg); border: 1px solid var(--panel-edge); border-radius: 5px; padding: 8px 8px 9px; display: grid; gap: 5px; position: relative; transition: background .12s, border-color .12s; }
.card .no { font-family: var(--display); font-size: 10.5px; letter-spacing: .08em; color: var(--ink-soft); text-transform: uppercase; }
.card input { width: 100%; font-family: var(--display); font-size: 22px; font-weight: 600; padding: 2px 4px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: var(--ink); font-variant-numeric: tabular-nums; }
.card input:hover { border-color: var(--panel-edge); }
.card .mlamps { display: flex; gap: 3px; }
.card .mlamps i { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-off); display: block; }
.card .mlamps i.on { background: var(--lamp-on); box-shadow: 0 0 5px 1px var(--lamp-glow); }
.card .means { font-size: 12.5px; line-height: 1.3; color: var(--ink-soft); min-height: 2.6em; }
.card .means b { color: var(--ink); font-weight: 600; }
.card.kind-job { background: var(--cell-job); }
.card.kind-box { background: var(--cell-box); }
.card.kind-num { background: var(--cell-num); }
.card.mark { outline: 3px solid var(--switch); outline-offset: 1px; }
.card.read { border-color: var(--lamp-on); box-shadow: 0 0 0 3px var(--lamp-glow); }
.card.wrote { border-color: var(--good); box-shadow: 0 0 0 3px var(--good); }
.card .flagtag { position: absolute; top: 6px; right: 6px; font-family: var(--display); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: var(--switch); color: var(--switch-up); }
.ministate { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ministate .st { display: grid; gap: 2px; }
.ministate .st b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.ministory { font-size: 16px; padding: 14px 16px; border-radius: 4px; border: 1px solid var(--panel-edge); background: var(--bg); min-height: 4.6em; }
.ministory .turnno { display: block; font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px 22px; }
.rule { display: grid; gap: 4px; align-content: start; }
.rule h3 { font-family: var(--display); font-size: 13px; font-weight: 600; margin: 0; }
.rule p { font-size: 14.5px; color: var(--ink-soft); }
.listing .pair { font-family: var(--display); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .lamp, .switch::after, .card { transition: none; } }
</style>

<style>*{box-sizing:border-box} body{margin:0;font-size:14px} img{max-width:100%}</style>
<link rel="stylesheet" href="../panel.css?v=20261017">
</head>
<body class="site-seed8">
<div class="wrap">
  <header>
    <div class="top">
      <span class="label" data-t="eyebrow"></span>
    </div>
    <p style="margin:0"><a href="../" style="font-family:var(--display);font-size:13px;color:var(--ink);text-decoration-color:var(--lamp-on);text-underline-offset:3px">&larr; Silicon Seed</a></p>
    <h1>Seed-8</h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <!-- 1. How to read a number -->
  <section aria-labelledby="h-binary">
    <h2 id="h-binary" data-t="binTitle"></h2>
    <div class="lesson">
      <div class="panel">
        <span class="label" data-t="binTry"></span>
        <div class="bits" id="binlamps"></div>
        <div class="sum" id="binsum" aria-live="polite"></div>
        <div class="game">
          <span id="bintarget"></span>
          <button class="act ghost" id="binnew" type="button" data-t="binNew"></button>
        </div>
        <div id="binverdict" aria-live="polite"></div>
      </div>
      <div class="levels">
        <div class="level"><span class="n">1</span><p data-t="lv1"></p></div>
        <div class="level"><span class="n">2</span><p data-t="lv2"></p></div>
        <div class="level"><span class="n">3</span><p data-t="lv3"></p></div>
        <div class="level"><span class="n">4</span><p data-t="lv4"></p></div>
      </div>
    </div>
  </section>


  <!-- 2. Boxes and a program -->
  <section aria-labelledby="h-boxes" class="boxlesson">
    <h2 id="h-boxes" data-t="bxTitle"></h2>
    <div class="rules">
      <div class="rule"><h3 data-t="r1h"></h3><p data-t="r1"></p></div>
      <div class="rule"><h3 data-t="r2h"></h3><p data-t="r2"></p></div>
      <div class="rule"><h3 data-t="r3h"></h3><p data-t="r3"></p></div>
      <div class="rule"><h3 data-t="r4h"></h3><p data-t="r4"></p></div>
    </div>
    <div class="panel mini">
      <span class="label" data-t="mxLabel"></span>
      <div class="cards" id="cards"></div>
      <div class="ministate" id="ministate"></div>
      <div class="ministory" id="ministory" aria-live="polite"></div>
      <div class="controls">
        <button class="act" id="mxnext" type="button" data-t="mxNext"></button>
        <button class="act ghost" id="mxjob" type="button" data-t="mxJob"></button>
        <button class="act ghost" id="mxreset" type="button" data-t="mxReset"></button>
      </div>
      <p class="note" data-t="mxTry"></p>
    </div>
  </section>

  <!-- 3. The machine -->
  <section aria-labelledby="h-machine">
    <h2 id="h-machine" data-t="machTitle"></h2>
    <div class="panel">
      <div class="part">
        <span class="label" data-t="lampsLabel"></span>
        <div class="bits" id="lamps"></div>
        <div class="readout" id="lampread"></div>
      </div>

      <div class="parts" id="parts"></div>

      <div class="part">
        <span class="label" data-t="stepsLabel"></span>
        <div class="steps" id="steps"></div>
      </div>

      <div class="flags" id="flags"></div>

      <div class="part">
        <span class="label" data-t="switchLabel"></span>
        <div class="bits" id="switches"></div>
        <div class="readout" id="swread"></div>
      </div>

      <div class="controls">
        <div class="field">
          <label class="label" for="prog" data-t="progLabel"></label>
          <select id="prog"></select>
        </div>
        <div class="field" id="yearfield">
          <label class="label" for="year" data-t="yearLabel"></label>
          <input id="year" type="number" min="1" max="65535" value="1">
        </div>
        <div class="field">
          <label class="label" for="speed" data-t="speedLabel"></label>
          <input id="speed" type="range" min="0" max="6" value="2">
          <output class="speed-read" id="speedread" for="speed"></output>
        </div>
        <button class="act" id="run" type="button"></button>
        <button class="act ghost" id="onejob" type="button" data-t="oneJob"></button>
        <button class="act ghost" id="oneturn" type="button" data-t="oneTurn"></button>
        <button class="act ghost" id="reset" type="button" data-t="reload"></button>
      </div>

      <div class="story" id="story" aria-live="polite"></div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- 3. Memory and program -->
  <section class="lower">
    <div class="part">
      <h2 data-t="memTitle"></h2>
      <p class="note" data-t="memNote"></p>
      <div class="legend" id="legend"></div>
      <div class="memwrap"><div class="mem" id="mem"></div></div>
      <div class="field" id="editbox" hidden>
        <label class="label" for="editval" id="editlabel"></label>
        <div class="controls"><input id="editval" type="text" style="width:7em"><button class="act" id="editok" type="button" data-t="weave"></button></div>
      </div>
    </div>
    <div class="part">
      <h2 data-t="listTitle"></h2>
      <p class="note" data-t="listNote"></p>
      <div class="listing" id="listing"></div>
      <span class="label" data-t="tapeLabel" style="margin-top:8px"></span>
      <div class="tape" id="tape"></div>
      <details><summary data-t="srcLabel"></summary><pre class="src" id="src"></pre></details>
    </div>
  </section>

  <!-- 4. What it is made of -->
  <section aria-labelledby="h-gates">
    <h2 id="h-gates" data-t="gatesTitle"></h2>
    <p class="note" data-t="gatesNote"></p>
    <div class="budget" id="budget"></div>
  </section>

  readBox(b) { return b === SW_BOX ? this.switches & 255 : this.mem[b]; }
  settle() {
    const v = this.v, fan = this.fan;
    for (let pass = 0; pass < 100; pass++) {
      let q = this.queue; this.queue = []; let budget = 50 * NG;
      while (q.length) {
        const g = G[q.pop()];
        if (--budget < 0) throw new Error("oscillation");
        const nv = (v[g[0]] && v[g[1]]) ? 0 : 1;
        if (v[g[2]] !== nv) { v[g[2]] = nv; const f = fan[g[2]]; for (let k = 0; k < f.length; k++) q.push(f[k]); }
      }
      this.set("mem_in", this.readBox(this.get("addr")));
      if (!this.queue.length) return;
    }
    throw new Error("did not settle");
  }
  clock() {
    const doing = this.get("S") === 2 && !this.get("H");
    const pre = doing ? {job: this.get("JOB"), box: this.get("BOX"), hand: this.get("A"), c: this.get("C")} : null;
    if (pre) pre.v = this.readBox(pre.box);
    this.set("phi1", 1); this.settle();
    const write = this.get("write"), box = this.get("addr"), hand = this.get("A");
    this.set("phi1", 0); this.settle();
    if (write) { this.mem[box] = hand; if (box === LAMP_BOX) this.tape.push(hand); this.set("mem_in", this.readBox(this.get("addr"))); this.settle(); }
    this.set("phi2", 1); this.settle();
    this.set("phi2", 0); this.settle();
    this.cycles++;
    if (pre) { this.jobs++; pre.hand1 = this.get("A"); pre.c1 = this.get("C"); pre.pc1 = this.get("PC"); return pre; }
    return null;
  }
  reset() { this.set("reset", 1); this.clock(); this.clock(); this.set("reset", 0); this.settle(); this.tape = []; this.cycles = 0; this.jobs = 0; }
}

/* the same machine described job by job, to check the gates */
function reference(mem0, sw) {
  const m = mem0.slice(); let a = 0, pc = 0, c = 0, tape = [], steps = 0;
  const rd = b => b === SW_BOX ? sw & 255 : m[b];
  while (steps++ < 200000) {
    const job = m[pc] & 7, x = m[(pc + 1) & 255]; pc = (pc + 2) & 255;
    if (job === 0) break;
    else if (job === 1) a = rd(x);
    else if (job === 2) { m[x] = a; if (x === LAMP_BOX) tape.push(a); }
    else if (job === 3) { const s = a + rd(x); a = s & 255; c = s >> 8; }
    else if (job === 4) a = (~(a & rd(x))) & 255;
    else if (job === 5) pc = x;
    else if (job === 6) { if (a === 0) pc = x; }
    else if (job === 7) { if (c) pc = x; }
  }
  return tape;
}

  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t, {g: NG}); });
  const sel = $("prog"), v = sel.value || "conformance";
  sel.innerHTML = ["boot", "mirror", "adder", "conformance"].map(p => `<option value="${p}">${t("p_" + p)}</option>`).join("");
  sel.value = v;
  $("legend").innerHTML = [["--cell-job", "lgJob"], ["--cell-box", "lgBox"], ["--cell-num", "lgNum"], ["--cell-hot", "lgHere"]].map(([c, k]) => `<span><i style="background:var(${c})"></i>${t(k)}</span>`).join("") + `<span><i style="outline:1px dashed var(--ink-soft);outline-offset:-1px"></i>${t("lgSpecial")}</span>`;
  if (lastStory) tell(lastStory);
  paintBin(); paintBudget(); paintMini(); if (sim) paint();
}

applyLang();
paintSpeed();
loadProgram();
</script>

</body>
</html>
